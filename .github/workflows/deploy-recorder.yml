name: Deploy recorder

# The call recorder (recorder/) is a Worker of its own with a container. Workers Builds does not deploy it.
# This workflow deploys it when recorder/ changes on main, and by hand ("Run workflow").
# It needs the RECORDER_DEPLOY_TOKEN repository secret: a Cloudflare API token that can edit Workers scripts and
# Containers (the repository's CLOUDFLARE_API_TOKEN reads D1 only). Without the secret, the job says so and stops
# with no error, and a human deploys from a computer (docs/workflow.md).
on:
  push:
    branches: [main]
    paths:
      - "recorder/**"
      - ".github/workflows/deploy-recorder.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never two deploys at once.
concurrency:
  group: deploy-recorder
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: recorder
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.RECORDER_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Is the deploy token set?
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::RECORDER_DEPLOY_TOKEN is not set: the recorder was not deployed. Deploy it from a computer (docs/workflow.md)."
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.set == 'true'
        uses: ./.github/actions/setup
      - if: steps.token.outputs.set == 'true'
        run: bun install --frozen-lockfile
      - if: steps.token.outputs.set == 'true'
        name: Types
        run: bun run check
      # The runner has Docker: wrangler builds the container image and pushes it.
      - if: steps.token.outputs.set == 'true'
        name: Deploy
        run: npx wrangler deploy
