name: Integrated native application browser

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Managed browser suite
        type: choice
        required: true
        default: application
        options:
          - application
          - design-system

permissions:
  contents: read

concurrency:
  group: native-application-browser-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'design-system' && '-design-system' || '' }}
  cancel-in-progress: true

jobs:
  native-application-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'design-system' && 30 || 20 }}
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096
      BROWSER_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'design-system' && 'design-system' || 'application' }}
      TEST_APP_REVISION: ${{ github.sha }}
      TEST_OUTPUT_DIR: ${{ github.workspace }}/.artifacts/${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'design-system' && 'design-system-browser' || 'native-application-browser' }}/report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22.23.5"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - run: bun run build:ui
      - run: bun run build:mcp
      - name: Real Worker, Book, D1, R2 and NativeApplication cohort
        run: |
          case "$BROWSER_SUITE" in
            application) bun run test:native-application:ci ;;
            design-system) bun scripts/native-application-ci.ts --suite design-system ;;
            *) echo "Unsupported managed browser suite" >&2; exit 2 ;;
          esac
      - name: Retain safe browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'design-system' && 'design-system-browser' || 'native-application-browser' }}-${{ github.sha }}
          path: ${{ env.TEST_OUTPUT_DIR }}/
          if-no-files-found: warn
          retention-days: 7
