[package]
name = "vibebook-tray"
version = "0.1.5"
edition = "2021"
description = "The deco.chat menu bar app: a shell that draws the menu that `vibebook tray` sends"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
